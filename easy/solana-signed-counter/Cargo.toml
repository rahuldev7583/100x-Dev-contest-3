[package]
name = "solana-signed-counter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
borsh = { version = "=1.5.7", features = ["derive"] }
solana-program = "=2.3.0"

[dev-dependencies]
solana-program-test = "=2.3.13"
solana-sdk = "=2.3.1"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread"] }
